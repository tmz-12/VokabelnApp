services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vokabelnapp
      POSTGRES_USER: vokabeln
      POSTGRES_PASSWORD: vokabeln
    ports:
      - "5432:5432"
    volumes:
      - vokabeln_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vokabeln -d vokabelnapp"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  vokabeln_postgres:
